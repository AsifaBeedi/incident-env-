name: IncidentResponseEnv
version: "1.0.0"
description: >
  A multi-task AI incident response environment that simulates real-world
  DevOps troubleshooting. The agent receives service metrics, log tails, and
  active alerts, then must diagnose the root cause and apply the correct fix
  in the fewest steps possible. Rewards are sequence-aware: investigation and
  correct diagnosis must precede remediation.

interface:
  reset: "returns Observation"
  step:  "returns (Observation, float, bool, dict)"
  state: "returns dict"

reward:
  range: [0.0, 1.0]
  type: float
  description: >
    Per-step reward strictly in (0.0, 1.0). Breakdown in info["reward_breakdown"].
  components:
    inspection:   "+0.15  relevant inspect_logs / check_metrics"
    diagnosis:    "+0.15  correct  |  -0.08 plausible-wrong  |  -0.15 wrong"
    fix:          "+0.25  correct fix after prior diagnosis"
    partial_fix:  "+0.02–0.05  symptom treatment"
    repeat:       "-0.08  same (action_type, target) repeated"
    no_diagnosis: "-0.15  remediation without prior diagnosis"
    harmful:      "-0.15  actively harmful action"
    irrelevant:   "-0.08  unrelated action"
    no_op:        "-0.03  wasted step"
    budget_bonus: "+0.03  correct action in first half of episode"

tasks:

  - id: auth-crash-loop
    name: "Auth Service Crash Loop"
    difficulty: easy
    max_steps: 6
    description: >
      auth-service is in a crash loop. db-proxy emits connection noise
      (red herring). Inspect auth-service, diagnose crash_loop, restart it.
    true_root_cause: crash_loop
    true_fix_target: auth-service
    services_affected: [auth-service, db-proxy]
    optimal_sequence:
      - inspect_logs:auth-service
      - restart_service:auth-service[diagnosis=crash_loop]

  - id: payments-oom-cascade
    name: "Payments OOM Cascade"
    difficulty: medium
    max_steps: 8
    description: >
      payments-service is OOM-killed. api-gateway degrades downstream.
      db-proxy slow queries are a red herring. Trace the cascade to payments,
      diagnose oom_kill, restart payments-service.
    true_root_cause: oom_kill
    true_fix_target: payments-service
    services_affected: [payments-service, api-gateway, auth-service, db-proxy]
    red_herrings:
      - "api-gateway 502s — downstream effect, not root cause"
      - "db-proxy slow queries — unrelated"
    optimal_sequence:
      - inspect_logs:payments-service
      - check_metrics:api-gateway
      - restart_service:payments-service[diagnosis=oom_kill]

  - id: network-split-db-leak
    name: "Network Split — DB WAL Saturation"
    difficulty: hard
    max_steps: 10
    description: >
      db-proxy WAL disk saturation from a network partition. Three competing
      hypotheses in the logs. Restarting frontends gives a false improvement
      before re-degrading. Only clearing WAL on db-proxy resolves the incident.
    true_root_cause: resource_saturation
    true_fix_target: db-proxy
    services_affected: [api-gateway, payments-service, user-service, db-proxy]
    healthy_services: [auth-service]
    red_herrings:
      - "payments memory 62% — not at OOM limit"
      - "api-gateway version mismatch — not a bad deploy"
    partial_fixes:
      - "restart_service api-gateway — recovers then re-degrades next step"
      - "restart_service payments-service — same pattern"
      - "scale_up db-proxy — reduces CPU, does not fix WAL"
    optimal_sequence:
      - inspect_logs:db-proxy
      - check_metrics:payments-service
      - clear_cache:db-proxy[diagnosis=resource_saturation]

action_space:
  type: discrete
  schema:
    action_type:
      type: enum
      required: true
      values:
        inspect_logs:    {category: diagnostic,   state_mutation: false}
        check_metrics:   {category: diagnostic,   state_mutation: false}
        restart_service: {category: remediation,  state_mutation: true}
        scale_up:        {category: remediation,  state_mutation: true}
        rollback:        {category: remediation,  state_mutation: true}
        clear_cache:     {category: remediation,  state_mutation: true}
        acknowledge:     {category: bookkeeping,  state_mutation: false}
        no_op:           {category: bookkeeping,  state_mutation: false}
    target:
      type: string
      required: false
      examples: [api-gateway, auth-service, payments-service, db-proxy, user-service]
    parameters:
      type: object
      required: false
      fields:
        diagnosis:
          type: enum
          required: false
          values: [oom_kill, crash_loop, upstream_timeout,
                   resource_saturation, bad_deploy, cache_poisoning]

observation_space:
  type: structured
  schema:
    step:          {type: int}
    time:          {type: float}
    services:
      type: list[ServiceState]
      item_schema:
        name:    {type: string}
        status:  {type: enum, values: [healthy, degraded, down]}
        version: {type: string}
        metrics:
          type: object
          fields:
            cpu_usage:    {type: float, range: [0.0, 100.0], unit: percent}
            memory_usage: {type: float, range: [0.0, 100.0], unit: percent}
            error_rate:   {type: float, range: [0.0, inf],   unit: errors/s}
            latency_ms:   {type: float, range: [0.0, inf],   unit: ms}
            request_rate: {type: float, range: [0.0, inf],   unit: req/s}
    logs:
      type: list[LogEntry]
      item_schema:
        timestamp: {type: float}
        severity:  {type: enum, values: [info, warning, error, critical]}
        service:   {type: string}
        message:   {type: string}
    active_alerts:   {type: list[string]}
    inspected:       {type: list[string]}
    diagnosis_set:   {type: bool}

info_keys:
  reward_breakdown:    {type: object}
  cumulative_reward:   {type: float}
  steps_remaining:     {type: int}
  task_solved:         {type: bool}
  diagnosis_set:       {type: bool}
  inspected_services:  {type: list[string]}
  _true_root_cause:    {type: string}
  _true_fix_target:    {type: string}

determinism:
  seeded: true
  seed_param: seed
  description: >
    All randomness driven by a single random.Random instance from `seed` at reset().

entry_point: "env/env.py:IncidentResponseEnv"
inference_script: "inference.py"
